name: Log timeline tests
on:
  pull_request:
    branches: [development, main]
permissions:
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-logs.mjs
      - run: node scripts/test-firefox-pause.mjs
      - run: npx --no-install tsc --noEmit
      - run: npm run build
